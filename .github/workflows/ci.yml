# AI Agent service CI guards the executable part of the AI coding standard.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-security:
    name: Build, Test, and Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Checkout rpc-api dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: sunkailun1992/rpc-api
          # Match com:rpc-api:1.0.9 exactly when dependency main advances.
          ref: 8021adbcae7cf1c8c1bd157bf57d482c6fa439ac
          path: .ci-rpc-api

      - name: Hide CI dependency checkout from scans
        run: |
          echo ".ci-rpc-api/" >> .git/info/exclude
          echo ".ci-utils/" >> .git/info/exclude

      - name: Publish rpc-api to Maven Local
        working-directory: .ci-rpc-api
        run: ./gradlew -q publishToMavenLocal

      - name: Checkout lightweight traffic and observability dependencies
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sunkailun1992/utils
          # Match com:traffic-canary:0.1.1 and com:fleet-observability:0.1.4 exactly when dependency main advances.
          ref: 33a648dee9df256c494f0e61e59070c924fe90d4
          path: .ci-utils

      - name: Publish lightweight dependencies to Maven Local
        working-directory: .ci-utils
        run: ./gradlew -q :fleet-observability:publishToMavenLocal :traffic-canary:publishToMavenLocal

      - name: Prepare scripts
        run: chmod +x gradlew scripts/check-secrets.sh

      - name: Compile
        run: ./gradlew -q compileJava

      - name: Test
        run: ./gradlew test

      - name: Secret warning scan
        run: bash scripts/check-secrets.sh
