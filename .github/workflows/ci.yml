# AI Agent service CI guards the executable part of the AI coding standard.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-security:
    name: Build, Test, and Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Checkout rpc-api dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: sunkailun1992/rpc-api
          # Match com:rpc-api:2.0.0 exactly when dependency main advances.
          ref: 7f840d43c2e85efeabc3f6917298eab8b04e67fc
          path: .ci-rpc-api

      - name: Hide CI dependency checkout from scans
        run: |
          echo ".ci-rpc-api/" >> .git/info/exclude
          echo ".ci-utils/" >> .git/info/exclude

      - name: Publish rpc-api to Maven Local
        working-directory: .ci-rpc-api
        run: ./gradlew -q publishToMavenLocal

      - name: Checkout utils dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sunkailun1992/utils
          # Match com:utils:2.0.6 (with its traffic-canary and fleet-observability modules) exactly when dependency main advances.
          ref: 553293448ade72eb3ea57693b2bd307181bd3813 # com:utils 2.0.6
          path: .ci-utils

      - name: Publish utils to Maven Local
        working-directory: .ci-utils
        run: ./gradlew -q publishToMavenLocal

      - name: Prepare scripts
        run: chmod +x gradlew scripts/check-secrets.sh

      - name: Compile
        run: ./gradlew -q compileJava

      - name: Test
        run: ./gradlew test

      - name: Secret warning scan
        run: bash scripts/check-secrets.sh
