plugins {
    id "java"
    id "org.springframework.boot"
    id "io.spring.dependency-management"
}

group = "com.ai.agent"
version = "0.2.6"

def privateMavenUrl = providers.gradleProperty("privateMavenUrl")
        .orElse(providers.environmentVariable("PRIVATE_MAVEN_URL"))
def privateMavenUsername = providers.gradleProperty("privateMavenUsername")
        .orElse(providers.environmentVariable("PRIVATE_MAVEN_USERNAME"))
def privateMavenPassword = providers.gradleProperty("privateMavenPassword")
        .orElse(providers.environmentVariable("PRIVATE_MAVEN_PASSWORD"))

ext {
    versions = [
            java              : 17,
            springAi          : "2.0.0",
            springCloud       : "2025.1.1",
            springCloudAlibaba: "2025.1.0.0",
            nacosClient       : "3.2.2",
            dubbo             : "3.3.6",
            rpcApi            : "1.0.7"
    ]
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(versions.java as int)
    }
}

springBoot {
    buildInfo()
    mainClass = "com.kellen.agent.AiAgentApplication"
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://maven.aliyun.com/repository/public" }
    if (privateMavenUrl.isPresent()) {
        maven {
            name = "privateRelease"
            url = uri(privateMavenUrl.get())
            if (privateMavenUsername.isPresent() && privateMavenPassword.isPresent()) {
                credentials {
                    username = privateMavenUsername.get()
                    password = privateMavenPassword.get()
                }
            }
        }
    }
}

bootJar {
    enabled = true
    inputs.property('applicationVersion', project.version) // 固定包名时，版本变化也必须触发重新打包。
    archiveFileName = "${project.name}.jar"
}

dependencyManagement {
    imports {
        mavenBom "io.opentelemetry:opentelemetry-bom:1.59.0"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${versions.springCloud}"
        mavenBom "com.alibaba.cloud:spring-cloud-alibaba-dependencies:${versions.springCloudAlibaba}"
        mavenBom "org.springframework.ai:spring-ai-bom:${versions.springAi}"
    }
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-webflux"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "io.micrometer:micrometer-registry-prometheus"
    implementation "io.opentelemetry:opentelemetry-api:1.59.0"
    implementation "com:fleet-observability:0.1.2" // 安全 HTTP 终态和固定 ECS 字段；不引入重型 utils。
    testImplementation "io.opentelemetry:opentelemetry-sdk-testing:1.59.0"
    implementation "com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery"
    implementation "com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-config"
    implementation "com.alibaba.nacos:nacos-client:${versions.nacosClient}"
    implementation "org.apache.dubbo:dubbo-spring-boot-starter:${versions.dubbo}"
    implementation "org.apache.dubbo:dubbo-registry-nacos:${versions.dubbo}"
    implementation "com:rpc-api:${versions.rpcApi}"
    implementation "org.springframework.ai:spring-ai-starter-model-google-genai"
    implementation "org.springframework.ai:spring-ai-openai"
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "com.alibaba.nacos"
                && (details.requested.name == "nacos-client" || details.requested.name.startsWith("nacos-"))) {
            details.useVersion versions.nacosClient
            details.because "Nacos client must match the 3.2.2 server line used by the shared microservice environment."
        }
    }
}

tasks.named("test") {
    useJUnitPlatform()
}
