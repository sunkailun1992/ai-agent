server:
  # AI Agent 执行层本地启动端口；线上可由 ai-agent-spring.yaml 覆盖。
  port: 7310

# 连接 Nacos 前必须先有的启动入口配置。
# 这里不能引用 reuse-configuration.yaml，因为远程配置还没有加载。
custom:
  # Nacos 默认分组，大部分公共配置放 DEFAULT_GROUP。
  nacos-group: ${GITHUB_NACOS_GROUP:DEFAULT_GROUP}

spring:
  profiles:
    # 只通过 APP_ENV 或 spring.profiles.active 选择 dev/test/prod；Nacos 地址和 namespace 放在对应 application-*.yml。
    active: ${APP_ENV:dev}
  application:
    # 服务注册名，也是主 ai 服务可通过服务名调用的 Agent 执行层名称。
    name: ai-agent
  main:
    # 兼容公共配置中可能重复声明的基础 Bean。
    allow-bean-definition-overriding: true
