server:
  # AI Agent 执行层本地启动端口；线上可由 ai-agent-spring.yaml 覆盖。
  port: 7310

# 连接 Nacos 前必须先有的启动入口配置。
# 这里不能引用 reuse-configuration.yaml，因为远程配置还没有加载。
custom:
  # Nacos 服务端地址，默认使用蒲公英内网地址；部署时可用 NACOS_SERVER_ADDR 覆盖。
  nacos-ip: ${NACOS_SERVER_ADDR:172.16.1.39:8848}
  # Nacos 命名空间，隔离本套微服务配置和注册实例。
  namespace: ${NACOS_NAMESPACE:cfbf4c42-5ebb-4566-a095-30a568556a85}
  # Nacos 默认分组，大部分公共配置放 DEFAULT_GROUP。
  nacos-group: ${NACOS_GROUP:DEFAULT_GROUP}

spring:
  application:
    # 服务注册名，也是主 ai 服务可通过服务名调用的 Agent 执行层名称。
    name: ai-agent
  main:
    # 兼容公共配置中可能重复声明的基础 Bean。
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      # 服务注册与发现配置。
      discovery:
        server-addr: ${custom.nacos-ip}
        namespace: ${custom.namespace}
        group: ${custom.nacos-group}
      # 配置中心入口，负责加载 spring.config.import 中列出的远程 YAML。
      config:
        server-addr: ${custom.nacos-ip}
        namespace: ${custom.namespace}
        group: ${custom.nacos-group}
        file-extension: yaml
  config:
    import:
      # logging.yml：日志级别、日志路径等通用日志配置。
      - "optional:nacos:logging.yml?group=DEFAULT_GROUP&refreshEnabled=true"
      # reuse-configuration.yaml：Nacos、模型服务和公共基础设施地址变量。
      - "optional:nacos:reuse-configuration.yaml?group=DEFAULT_GROUP&refreshEnabled=true"
      # swagger.yaml：Fleet 统一 Swagger/OpenAPI 开关（显示名默认取服务名）。
      - "optional:nacos:swagger.yaml?group=DEFAULT_GROUP&refreshEnabled=true"
      # ai-agent.yaml：Agent 执行层专属业务参数和 ai.prompts.* Prompt 配置。
      - "optional:nacos:ai-agent.yaml?group=DEFAULT_GROUP&refreshEnabled=true"
      # ai-agent-spring.yaml：Agent 执行层 Spring AI、端口和 Actuator 等配置；group=DEFAULT_GROUP 是当前 Nacos 环境分组标识，不是单元测试资源。
      - "optional:nacos:ai-agent-spring.yaml?group=DEFAULT_GROUP&refreshEnabled=true"
      # a2a.yaml：A2A 共享契约值（custom.a2a-*），ai-agent 生产端 ai.agent.registry.* 引用。
      - "optional:nacos:a2a.yaml?group=DEFAULT_GROUP&refreshEnabled=true"
