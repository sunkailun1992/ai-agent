# 全量上下文测试（TestAiAgentApplication）的资源服务器配置，与 Nacos ai-agent-spring.yaml 同形：只收受众 github-ai-agent、
# azp github-ai 的 RS256 令牌。签发方用保留域名 keycloak.invalid，测试不访问；要签真令牌的用例自己起本机回环签发方。
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://keycloak.invalid/realms/github-dev
spring.security.oauth2.resourceserver.jwt.jws-algorithms=RS256
spring.security.oauth2.resourceserver.jwt.audiences=github-ai-agent
fleet.security.oauth2.required-azp=github-ai
